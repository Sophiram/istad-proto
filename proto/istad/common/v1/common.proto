// istad/common/v1/common.proto
syntax = "proto3";
package istad.common.v1;
option java_multiple_files = true;
option java_package = "kh.edu.istad.common.grpc.v1";

// Decimal as string maps losslessly to BigDecimal. Never use float/double for money.
message Money {
  string amount   = 1;   // "12.50"
  string currency = 2;   // "USD", "KHR"
}

message PageRequest { int32 page = 1; int32 size = 2; }
message PageInfo {
  int32 page = 1; int32 size = 2;
  int64 total_elements = 3; int32 total_pages = 4;
}